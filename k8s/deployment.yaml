apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-security-app
  labels:
    app: network-security-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-security-app
  template:
    metadata:
      labels:
        app: network-security-app
    spec:
      containers:
        - name: network-security-app
          image: omkulkarni1226/network-security-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: network-security-secrets
                  key: MONGO_DB_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10